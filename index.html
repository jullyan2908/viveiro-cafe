<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Viveiro Café</title>
    <meta name="description" content="Estoque, clientes e vendas das mudas de café do viveiro.">
    <meta name="theme-color" content="#241509">
    <meta name="color-scheme" content="dark">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Viveiro Café">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <!-- tela de abertura: aparece antes do JavaScript carregar e some quando o app sabe quem está entrando -->
    <div id="app">
        <main class="tela-central">
            <img class="login-logo" src="icons/icon-192.png" width="72" height="72" alt="">
            <p class="carregando-texto" role="status">Abrindo o app…</p>
            <div class="pontos" aria-hidden="true"><span></span><span></span><span></span></div>
        </main>
    </div>

    <div id="camada"></div>
    <div id="avisos" role="status" aria-live="polite"></div>

    <noscript>
        <p style="padding:24px;color:#F1E6D2">O Viveiro Café precisa de JavaScript para funcionar. Ative o JavaScript no navegador e recarregue a página.</p>
    </noscript>

    <script src="js/versao.js"></script>
    <script src="vendor/firebase-app-compat.js"></script>
    <script src="vendor/firebase-auth-compat.js"></script>
    <script src="vendor/firebase-firestore-compat.js"></script>
    <script src="vendor/xlsx.bundle.js"></script>
    <script type="module" src="js/principal.js"></script>
</body>
</html>
