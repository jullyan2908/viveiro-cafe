<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1">

    <title>Viveiro & Vendas</title>

    <!-- PWA -->
    <meta name="theme-color" content="#241509">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Viveiro Café">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app-root"></div>

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {

        navigator.serviceWorker.register('service-worker.js').then(registration => {

            // toda vez que o app abre, força checar se tem versão nova no GitHub
            registration.update();

            // se já tiver uma versão nova parada esperando, manda ela assumir na hora
            if (registration.waiting) {
                registration.waiting.postMessage('skipWaiting');
            }

            registration.addEventListener('updatefound', () => {
                const novoWorker = registration.installing;
                novoWorker.addEventListener('statechange', () => {
                    if (novoWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        novoWorker.postMessage('skipWaiting');
                    }
                });
            });

        });

        // quando a versão nova assume o controle, recarrega a página sozinho
        let jaRecarregou = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (jaRecarregou) return;
            jaRecarregou = true;
            window.location.reload();
        });

    });
}
</script>

</body>
</html>
